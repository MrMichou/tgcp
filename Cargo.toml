[package]
name = "tgcp"
version = "0.4.1"
edition = "2021"
description = "Terminal UI for GCP - navigate, observe, and manage Google Cloud Platform resources"
license = "MIT"
repository = "https://github.com/mnicolet/tgcp"
readme = "README.md"
keywords = ["gcp", "google-cloud", "tui", "terminal", "cloud", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]
authors = ["mnicolet"]

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# GCP Authentication
gcp_auth = "0.12"

# HTTP client (using rustls to avoid OpenSSL cross-compilation issues)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
urlencoding = "2.1"

# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utils
anyhow = "1.0"
dirs = "6.0"
uuid = { version = "1.20", features = ["v4"] }
chrono = "0.4"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-linux-x86_64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-darwin-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-darwin-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tgcp-windows-x86_64.exe.zip"
pkg-fmt = "zip"

[dev-dependencies]
dirs = "6.0"
wiremock = "0.6"
proptest = "1.5"
tokio-test = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
